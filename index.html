<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tienda Online</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="css/styles.css" />
</head>

<body>

    <!-- Encabezado con carrito -->
    <nav class="navbar bg-dark navbar-dark px-4">
        <span class="navbar-brand">Tienda Online</span>
        <div>
            <button class="btn btn-outline-light position-relative">
                🛒
                <span id="contadorCarrito"
                    class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger">
                    0
                </span>
            </button>
        </div>
    </nav>

    <!-- Carousel superior -->
    <div id="carouselExample" class="carousel slide" data-bs-ride="carousel">
        <div class="carousel-inner">
            <div class="carousel-item active">
                <img src="https://placehold.co/1200x300?text=Banner+1" class="d-block w-100" alt="..." />
            </div>
        </div>
    </div>

    <!-- Contenido principal -->
    <div class="container-fluid mt-4">
        <div class="row">

            <!-- Categorías -->
            <div class="col-sm-3 mb-4">
                <h5>Categorías</h5>
                <ul class="list-group">
                    <li class="list-group-item">Electrónica</li>
                    <li class="list-group-item">Ropa</li>
                    <li class="list-group-item">Hogar</li>
                </ul>
            </div>

            <!-- Productos -->
            <div class="col-sm-9">
                <div class="row" id="contenedorProductos">
                                       
                   
                </div>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="text-center py-4 bg-light mt-4">
        Diseñado por: [Tu Nombre] - [Tu Carné]
    </footer>
    <script>
        obtenerDatos();

    async function obtenerDatos() {
        try {
            const respuesta = await fetch('https://backservicetest-g8emcvdff0fqe2b8.canadacentral-01.azurewebsites.net/api/producto');
            
            if (!respuesta.ok) {
                throw new Error('No se pudo encontrar el recurso');
            }
            
            const productos = await respuesta.json();
            renderizarProductos(productos);

        } catch (error) {
            console.error('Hubo un error:', error);
            document.getElementById('contenedorProductos').innerHTML = `
                <div class="col-12 text-center text-danger">
                    <p>Ocurrió un error al cargar los productos.</p>
                </div>`;
        }
    }

    function renderizarProductos(productos) {
        const contenedor = document.getElementById('contenedorProductos');
        
        // Limpiamos el contenedor por si tenía contenido estático previo
        contenedor.innerHTML = '';

        // Recorremos cada producto para construir su tarjeta
        productos.forEach(producto => {
            // Manejo del precio si el producto está en oferta
            const plantillaPrecio = producto.enOferta 
                ? `<span class="text-muted text-decoration-line-through me-2">$${producto.precio.toFixed(2)}</span>
                   <span class="fw-bold text-success">$${producto.precioOferta.toFixed(2)}</span>`
                : `<span class="fw-bold">$${producto.precio.toFixed(2)}</span>`;

            // Badge condicional si está en oferta
            const badgeOferta = producto.enOferta 
                ? `<span class="badge bg-danger position-absolute top-0 end-0 m-2">¡Oferta!</span>` 
                : '';

            const tarjetaHtml = `
                <div class="col-md-4 col-sm-12 p-2">
                    <div class="card h-100 position-relative shadow-sm">
                        ${badgeOferta}
                        <img src="${producto.imagen}" class="card-img-top" alt="${producto.nombre}">
                        <div class="card-body d-flex flex-column">
                            <span class="badge bg-secondary mb-2 w-auto align-self-start">${producto.categoriaNombre}</span>
                            <h5 class="card-title">${producto.nombre}</h5>
                            <p class="card-text flex-grow-1">${producto.descripcion}</p>
                            <div class="d-flex justify-content-between align-items-center mt-3">
                                <div>${plantillaPrecio}</div>
                                <a href="#" class="btn btn-primary btn-sm">Ver detalles</a>
                            </div>
                        </div>
                    </div>
                </div>
            `;

            contenedor.innerHTML += tarjetaHtml;
        });
    }
    </script>


</body>

</html>
